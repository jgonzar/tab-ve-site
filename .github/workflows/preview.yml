# Checks that run against a PR's live Vercel preview. Vercel reports each
# deployment back to GitHub as a deployment status; this workflow starts when a
# Preview deployment succeeds and reads its URL from that event.
#
# L1 checks the served security headers; L2 runs the Playwright suite (the `/`
# redirect matrix, the head, the language cookie) against Vercel itself. L4
# adds its jobs here (axe, link check, Lighthouse), each reading PREVIEW_URL.
#
# Previews sit behind Vercel Authentication, so requests carry the project's
# "Protection Bypass for Automation" secret, stored in this repo as the Actions
# secret VERCEL_AUTOMATION_BYPASS_SECRET.

name: Preview

on:
  deployment_status:

permissions:
  contents: read

jobs:
  headers:
    name: preview-headers
    # Vercel names the environment "Preview", or "Preview" plus the project name
    # on some accounts, hence startsWith
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Served headers match vercel.json and meet the A+ criteria
        run: node scripts/check-headers.mjs --url "$PREVIEW_URL"

  e2e:
    name: preview-e2e
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (the version pinned by @playwright/test)
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Playwright, against the preview
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: preview-lighthouse
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (full, for Lighthouse)
        run: pnpm exec playwright install --with-deps chromium
      - name: Lighthouse budgets, against the preview (is-crawlable set aside)
        run: node scripts/lighthouse.mjs --url "$PREVIEW_URL"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report-preview
          path: lighthouse-report/
          retention-days: 7
